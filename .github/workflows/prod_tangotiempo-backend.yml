name: Deploy to Production - TangoTiempo BackEnd

on:
  push:
    branches:
      - PROD
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: "Production"
    steps:
      # Checkout the code
      - name: "Checkout code"
        uses: actions/checkout@v3

      # Set up Node.js environment
      - name: "Set up Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      # Install dependencies and build
      - name: "Install dependencies and build"
        run: |
          npm install
          npm run build --if-present

      # Zip the artifact for deployment
      - name: "Zip artifact for deployment"
        run: zip release.zip ./* -r

      # Upload the artifact for deployment
      - name: "Upload artifact for deployment"
        uses: actions/upload-artifact@v3
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
    steps:
      # Download artifact from the build step
      - name: "Download artifact from build job"
        uses: actions/download-artifact@v3
        with:
          name: node-app

      # Unzip artifact for deployment
      - name: "Unzip artifact for deployment"
        run: unzip release.zip

      # Deploy to Azure Web App
      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "TangoTiempo-PROD-Backend"
          slot-name: "Production"
          package: .